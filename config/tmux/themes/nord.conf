# Nord theme for tmux
# Based on Nord tmux by Sven Greb (MIT): https://github.com/nordtheme/tmux

set -g @dotfiles_tmux_theme "nord"

# Status bar
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style "bg=#2E3440,fg=#ECEFF4"

set -g status-left "#[fg=#2E3440,bg=#5E81AC,bold] #S #[fg=#5E81AC,bg=#2E3440,nobold,noitalics,nounderscore]"
set -g status-right "#{?client_prefix,#[fg=#BF616A,bg=#2E3440]#[fg=#2E3440,bg=#BF616A,bold] PREFIX ,}#[fg=#4C566A,bg=#2E3440,nobold,noitalics,nounderscore]#[fg=#ECEFF4,bg=#4C566A] %Y-%m-%d #[fg=#ECEFF4,bg=#4C566A,nobold,noitalics,nounderscore]#[fg=#ECEFF4,bg=#4C566A] %H:%M #[fg=#88C0D0,bg=#4C566A,nobold,noitalics,nounderscore]#[fg=#2E3440,bg=#88C0D0,bold] #H "

set -g window-status-format "#[fg=#2E3440,bg=#4C566A,nobold,noitalics,nounderscore] #[fg=#ECEFF4,bg=#4C566A]#I #[fg=#ECEFF4,bg=#4C566A,nobold,noitalics,nounderscore] #[fg=#ECEFF4,bg=#4C566A]#W #F #[fg=#4C566A,bg=#2E3440,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0,bold]#I #[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0,bold]#W #F #[fg=#88C0D0,bg=#2E3440,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#88C0D0,bg=#4C566A"
set -g window-status-bell-style "fg=#2E3440,bg=#BF616A,bold"
set -g window-status-last-style "fg=#D8DEE9,bg=#4C566A"

# Panes and modes
set -g pane-border-style "bg=default,fg=#4C566A"
set -g pane-active-border-style "bg=default,fg=#5E81AC"
set -g display-panes-colour "#D8DEE9"
set -g display-panes-active-colour "#81A1C1"
setw -g clock-mode-colour "#88C0D0"
setw -g mode-style "bg=#4C566A,fg=#ECEFF4"
setw -g copy-mode-mark-style "bg=#EBCB8B,fg=#2E3440"

# Messages, menus and popups
set -g message-style "bg=#4C566A,fg=#88C0D0"
set -g message-command-style "bg=#4C566A,fg=#88C0D0"
set -g menu-style "bg=#3B4252,fg=#ECEFF4"
set -g menu-selected-style "bg=#5E81AC,fg=#ECEFF4,bold"
set -g menu-border-style "fg=#5E81AC"
set -g popup-style "bg=#3B4252,fg=#ECEFF4"
set -g popup-border-style "fg=#5E81AC"
