# Nord Light theme for tmux
# https://github.com/nord-light/tmux

set -g @dotfiles_tmux_theme "nord-light"

# Status bar
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style "bg=#E5E9F0,fg=#2E3440"

set -g status-left "#[fg=#ECEFF4,bg=#3B5E85,bold] #S #[fg=#3B5E85,bg=#E5E9F0,nobold,noitalics,nounderscore]"
set -g status-right "#{?client_prefix,#[fg=#AE4750,bg=#E5E9F0]#[fg=#ECEFF4,bg=#AE4750,bold] PREFIX ,}#[fg=#C8D0DA,bg=#E5E9F0,nobold,noitalics,nounderscore]#[fg=#3B4252,bg=#C8D0DA] %Y-%m-%d #[fg=#3B4252,bg=#C8D0DA,nobold,noitalics,nounderscore]#[fg=#3B4252,bg=#C8D0DA] %H:%M #[fg=#0C7482,bg=#C8D0DA,nobold,noitalics,nounderscore]#[fg=#ECEFF4,bg=#0C7482,bold] #H "

set -g window-status-format "#[fg=#E5E9F0,bg=#D8DEE9,nobold,noitalics,nounderscore] #[fg=#3B4252,bg=#D8DEE9]#I #[fg=#3B4252,bg=#D8DEE9,nobold,noitalics,nounderscore] #[fg=#3B4252,bg=#D8DEE9]#W #F #[fg=#D8DEE9,bg=#E5E9F0,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#E5E9F0,bg=#0C7482,nobold,noitalics,nounderscore] #[fg=#ECEFF4,bg=#0C7482,bold]#I #[fg=#ECEFF4,bg=#0C7482,nobold,noitalics,nounderscore] #[fg=#ECEFF4,bg=#0C7482,bold]#W #F #[fg=#0C7482,bg=#E5E9F0,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#3B5E85,bg=#D8DEE9"
set -g window-status-bell-style "fg=#ECEFF4,bg=#AE4750,bold"
set -g window-status-last-style "fg=#4C566A,bg=#D8DEE9"

# Panes and modes
set -g pane-border-style "bg=default,fg=#C8D0DA"
set -g pane-active-border-style "bg=default,fg=#3B5E85"
set -g display-panes-colour "#2E3440"
set -g display-panes-active-colour "#4C566A"
setw -g clock-mode-colour "#0C7482"
setw -g mode-style "bg=#C8D0DA,fg=#2E3440"
setw -g copy-mode-mark-style "bg=#7F6614,fg=#ECEFF4"

# Messages, menus and popups
set -g message-style "bg=#D8DEE9,fg=#2E3440"
set -g message-command-style "bg=#D8DEE9,fg=#2E3440"
set -g menu-style "bg=#ECEFF4,fg=#2E3440"
set -g menu-selected-style "bg=#3B5E85,fg=#ECEFF4,bold"
set -g menu-border-style "fg=#3B5E85"
set -g popup-style "bg=#ECEFF4,fg=#2E3440"
set -g popup-border-style "fg=#3B5E85"
