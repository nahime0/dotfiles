######################
# -- Kitty Config -- #
######################

##############################
# Font Configuration         #
# https://www.nerdfonts.com/ #
##############################

# JetBrainsMono
# -------------
# font_family JetBrainsMono Nerd Font Mono Regular
# bold_font JetBrainsMono Nerd Font Mono Bold
# italic_font JetBrainsMono Nerd Font Mono Italic
# bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic

# ComicShannsMono
# ---------------
font_family ComicShannsMono Nerd Font Mono Regular
bold_font ComicShannsMono Nerd Font Mono Bold
italic_font ComicShannsMono Nerd Font Mono Italic
bold_italic_font ComicShannsMono Nerd Font Mono Bold Italic

# Font size
font_size 17
adjust_line_height 100%

# Audio
enable_audio_bell 0

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_title_max_length 20


#####################
# -- Kitty Theme -- #
#####################

# Kitty selects nord.conf or nord-light.conf through the OS-aware
# *-theme.auto.conf files in this directory.

#########################################
# -- Visual Conf --                     #
# Here to override theme configuration  #
#########################################

window_padding_width 0

#################
# -- Keymaps -- #
#################

# Use Option (⌥) as Alt/Meta key
macos_option_as_alt right

# Send a distinct CSI-u sequence so terminal UIs can distinguish Shift+Enter
# from Enter, including when running through tmux.
map shift+enter send_text all \x1b[13;2u
