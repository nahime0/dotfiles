# AeroSpace — https://nikitabobko.github.io/AeroSpace/guide
# i3-like tiling window manager for macOS

config-version = 2

start-at-login = true

# JankyBorders temporarily disabled
after-startup-command = []

# Window tree normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Move the mouse to the monitor taking focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

# Gaps between windows and from the screen edges
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.top        = 8
outer.bottom     = 8

# ── Main layer ────────────────────────────────────
# Modifiers: focus/workspace/layout = cmd-ctrl · move window = alt-ctrl
[mode.main.binding]
# Layout
cmd-ctrl-slash = 'layout tiles horizontal vertical'     # toggle horizontal/vertical tiling
cmd-ctrl-comma = 'layout accordion horizontal vertical' # accordion layout

# Focus (vim hjkl)
cmd-ctrl-h = 'focus left'
cmd-ctrl-j = 'focus down'
cmd-ctrl-k = 'focus up'
cmd-ctrl-l = 'focus right'

# Move the window
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Resize
cmd-ctrl-minus = 'resize smart -50'
cmd-ctrl-equal = 'resize smart +50'

# Workspaces 0-9, top letter row (except Q), and bottom letter row
cmd-ctrl-0 = 'workspace 0'
cmd-ctrl-1 = 'workspace 1'
cmd-ctrl-2 = 'workspace 2'
cmd-ctrl-3 = 'workspace 3'
cmd-ctrl-4 = 'workspace 4'
cmd-ctrl-5 = 'workspace 5'
cmd-ctrl-6 = 'workspace 6'
cmd-ctrl-7 = 'workspace 7'
cmd-ctrl-8 = 'workspace 8'
cmd-ctrl-9 = 'workspace 9'
cmd-ctrl-w = 'workspace W'
cmd-ctrl-e = 'workspace E'
cmd-ctrl-r = 'workspace R'
cmd-ctrl-t = 'workspace T'
cmd-ctrl-y = 'workspace Y'
cmd-ctrl-u = 'workspace U'
cmd-ctrl-i = 'workspace I'
cmd-ctrl-o = 'workspace O'
cmd-ctrl-p = 'workspace P'
cmd-ctrl-z = 'workspace Z'
cmd-ctrl-x = 'workspace X'
cmd-ctrl-c = 'workspace C'
cmd-ctrl-v = 'workspace V'
cmd-ctrl-b = 'workspace B'
cmd-ctrl-n = 'workspace N'
cmd-ctrl-m = 'workspace M'

# Move the window to a workspace
alt-ctrl-0 = 'move-node-to-workspace 0'
alt-ctrl-1 = 'move-node-to-workspace 1'
alt-ctrl-2 = 'move-node-to-workspace 2'
alt-ctrl-3 = 'move-node-to-workspace 3'
alt-ctrl-4 = 'move-node-to-workspace 4'
alt-ctrl-5 = 'move-node-to-workspace 5'
alt-ctrl-6 = 'move-node-to-workspace 6'
alt-ctrl-7 = 'move-node-to-workspace 7'
alt-ctrl-8 = 'move-node-to-workspace 8'
alt-ctrl-9 = 'move-node-to-workspace 9'
alt-ctrl-w = 'move-node-to-workspace W'
alt-ctrl-e = 'move-node-to-workspace E'
alt-ctrl-r = 'move-node-to-workspace R'
alt-ctrl-t = 'move-node-to-workspace T'
alt-ctrl-y = 'move-node-to-workspace Y'
alt-ctrl-u = 'move-node-to-workspace U'
alt-ctrl-i = 'move-node-to-workspace I'
alt-ctrl-o = 'move-node-to-workspace O'
alt-ctrl-p = 'move-node-to-workspace P'
alt-ctrl-z = 'move-node-to-workspace Z'
alt-ctrl-x = 'move-node-to-workspace X'
alt-ctrl-c = 'move-node-to-workspace C'
alt-ctrl-v = 'move-node-to-workspace V'
alt-ctrl-b = 'move-node-to-workspace B'
alt-ctrl-n = 'move-node-to-workspace N'
alt-ctrl-m = 'move-node-to-workspace M'

# Navigate between workspaces / monitors
cmd-ctrl-tab = 'workspace-back-and-forth'
alt-ctrl-tab = 'move-workspace-to-monitor --wrap-around next'

# Fullscreen
alt-ctrl-f = 'fullscreen'

# Enter service mode
alt-ctrl-semicolon = 'mode service'

# ── Service mode (⌥⌃;) ────────────────────────────
[mode.service.binding]
esc = ['reload-config', 'mode main']          # reload config
r = ['flatten-workspace-tree', 'mode main']   # reset the layout
f = ['layout floating tiling', 'mode main']   # floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']

# Join windows into a container
alt-ctrl-h = ['join-with left', 'mode main']
alt-ctrl-j = ['join-with down', 'mode main']
alt-ctrl-k = ['join-with up', 'mode main']
alt-ctrl-l = ['join-with right', 'mode main']

# ── Apps that do not tile well → floating ─────────
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'   # System Settings
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.belightsoft.GetBackup-setapp' # Get Backup Pro
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.anysphere.sand'            # Grok Bot
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.parallels.desktop.console' # Parallels Desktop VMs
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.superduper.superwhisper'   # Superwhisper
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'         # Bitwarden
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = '^Bitwarden$' # Bitwarden extension pop-out
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'ai.perplexity.comet'
if.window-title-regex-substring = '^Bitwarden$' # Bitwarden extension pop-out
run = 'layout floating'
