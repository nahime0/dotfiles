# Personal behaviour, with colours delegated to Omarchy's terminal palette.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -g extended-keys on
set -g extended-keys-format csi-u
bind-key -T root S-Enter send-keys Escape "[13;2u"

set -g prefix C-q
unbind C-b
bind C-q send-prefix
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g allow-rename off
set -g set-titles on
set -g set-titles-string '#h:#W'
set -g visual-activity off
set -g visual-bell off
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -s escape-time 0

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key e capture-pane -J -S - -E - -b tmux-scrollback \; \
  display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" \
  "~/.tmux/scripts/edit-scrollback tmux-scrollback"
bind-key -r P new-window p
bind-key s choose-tree -Zw

is_vim='echo "#{pane_current_command}" | grep -iqE "(^|/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Shape and position are personal; symbolic ANSI colours follow Omarchy.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=blue,fg=black,bold,width=100%,align=left,fill=blue"
set -g message-command-style "bg=blue,fg=black,bold,width=100%,align=left,fill=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
